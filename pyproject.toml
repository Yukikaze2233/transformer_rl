[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-rl"
version = "0.1.0"
description = "Time-aware causal Transformer control with an independent PyTorch PPO trainer"
authors = [{name = "yukikaze2233", email = "yingziyuw@gmail.com"}]
requires-python = ">=3.11"
dependencies = ["torch>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]
export = ["onnx>=1.18", "onnxruntime>=1.20", "numpy>=1.26"]

[project.scripts]
transformer-rl = "transformer_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
